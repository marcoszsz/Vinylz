<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl - Colecoes</title>
  <link rel="stylesheet" href="collections.css" />
  <meta name="theme-color" content="#0b0b0d" />
</head>

<body>
  <header class="navbar">
    <a href="home.html" class="logo">VINYL</a>

    <nav class="navbar-links" id="navbarLinks">
      <a href="home.html">Home</a>
      <a href="search.html">Catalogo</a>
      <a href="timeline.html">Timeline</a>
      <a href="collections.html" class="active">Colecoes</a>
      <a href="insights.html">Insights</a>
      <a href="profile.html">Perfil</a>
    </nav>

    <div class="navbar-actions">
      <a href="profile.html" class="navbar-profile">
        <img src="https://placehold.co/120x120/111111/ff4d6d?text=V" alt="Avatar" id="navbarAvatar" />
        <span id="navbarUsername">Perfil</span>
      </a>

      <button type="button" class="logout-btn" id="logoutBtn">Sair</button>
      <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menu">Menu</button>
    </div>
  </header>

  <main class="collections-page">
    <section class="collections-header">
      <div>
        <span class="eyebrow">Prateleiras musicais</span>
        <h1>Colecoes para organizar sua fase sonora</h1>
      </div>

      <a href="insights.html" class="header-link">Ver insights</a>
    </section>

    <section class="workspace">
      <form class="collection-form" id="collectionForm">
        <h2>Nova colecao</h2>

        <label>
          Nome
          <input type="text" id="collectionTitle" maxlength="48" placeholder="Ex: Chuva na janela" required />
        </label>

        <label>
          Vibe
          <select id="collectionVibe">
            <option value="Noite">Noite</option>
            <option value="Foco">Foco</option>
            <option value="Nostalgia">Nostalgia</option>
            <option value="Treino">Treino</option>
            <option value="Viagem">Viagem</option>
            <option value="Descoberta">Descoberta</option>
          </select>
        </label>

        <label>
          Capa
          <input type="url" id="collectionCover" placeholder="https://..." />
        </label>

        <label>
          Nota
          <textarea id="collectionNote" maxlength="180" placeholder="Por que essa colecao existe?"></textarea>
        </label>

        <button type="submit">Criar colecao</button>
      </form>

      <section class="collections-board">
        <div class="board-toolbar">
          <div>
            <h2>Suas colecoes</h2>
            <p id="collectionsSummary">Carregando...</p>
          </div>

          <div class="quick-vibes" id="quickVibes">
            <button type="button" data-vibe="Noite">Noite</button>
            <button type="button" data-vibe="Foco">Foco</button>
            <button type="button" data-vibe="Nostalgia">Nostalgia</button>
          </div>
        </div>

        <div class="collections-grid" id="collectionsGrid">
          <p class="empty-state">Carregando colecoes...</p>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="collections.js"></script>
</body>
</html>
