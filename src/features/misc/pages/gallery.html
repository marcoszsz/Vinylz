<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyl — Galeria</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

  <header class="navbar">
    <a href="home.html" class="logo">VINYL</a>

    <nav>
      <a href="home.html">Home</a>
      <a href="search.html">Catálogo</a>
      <a href="social.html">Social</a>
      <a href="profile.html">Perfil</a>
    </nav>
  </header>

  <main class="gallery-page">

    <section class="gallery-hero">
      <span class="tag">Galeria musical</span>
      <h1 id="galleryTitle">Galeria</h1>
      <p>Veja imagens, capas e artistas relacionados à sua busca.</p>

      <div class="gallery-search">
        <input id="gallerySearchInput" type="text" placeholder="Buscar artista, álbum ou música...">
        <button id="gallerySearchBtn">Buscar</button>
      </div>
    </section>

    <section class="gallery-tabs">
      <button class="gallery-tab active" data-tab="artists">Artistas</button>
      <button class="gallery-tab" data-tab="albums">Álbuns</button>
      <button class="gallery-tab" data-tab="tracks">Músicas</button>
    </section>

    <section id="galleryGrid" class="gallery-grid">
      <p class="message">Busque algo para começar.</p>
    </section>

  </main>

  <script type="module" src="gallery.js"></script>
  <script type="module" src="protect.js"></script>
</body>
</html>
