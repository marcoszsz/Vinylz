<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VINYL — Chat</title>

  <link rel="stylesheet" href="chat.css" />
  <meta name="theme-color" content="#0b0b0d" />
</head>

<body>

  <main class="chat-page">

    <section class="chat-card">

      <header class="chat-header">

        <a href="home.html" class="back-btn" aria-label="Voltar">
          ←
        </a>

        <a href="#" class="chat-user" id="targetProfileLink">
          <img
            src="https://placehold.co/120x120/111111/ff4d6d?text=V"
            alt="Avatar"
            id="targetAvatar"
          />

          <div>
            <h1 id="targetName">Carregando...</h1>
            <p id="targetStatus">VINYL Chat</p>
          </div>
        </a>

        <div class="chat-header-actions">

          <button type="button" class="chat-options-btn" id="chatOptionsBtn" aria-label="Opções do chat">
            ⋯
          </button>

          <div class="chat-options-menu" id="chatOptionsMenu" hidden>
            <button type="button" id="viewProfileBtn">Ver perfil</button>
            <button type="button" id="muteUserBtn">Silenciar</button>
            <button type="button" id="blockUserBtn" class="danger">Bloquear</button>
            <button type="button" id="reportUserBtn">Denunciar</button>
          </div>

        </div>

      </header>

      <div class="chat-messages" id="messagesContainer">

        <div class="chat-loading-state">
          <div class="chat-loader"></div>
          <p>Carregando mensagens...</p>
        </div>

      </div>

      <div class="typing-indicator" id="typingIndicator" hidden>
        <span></span>
        <span></span>
        <span></span>
        <p id="typingText">Digitando...</p>
      </div>

      <div class="reply-preview" id="replyPreview" hidden>
        <div>
          <strong id="replyPreviewName">Respondendo</strong>
          <p id="replyPreviewText"></p>
        </div>

        <button type="button" id="cancelReplyBtn" aria-label="Cancelar resposta">
          ×
        </button>
      </div>

      <div class="edit-preview" id="editPreview" hidden>
        <div>
          <strong>Editando mensagem</strong>
          <p id="editPreviewText"></p>
        </div>

        <button type="button" id="cancelEditBtn" aria-label="Cancelar edição">
          ×
        </button>
      </div>

      <form class="chat-form" id="chatForm">

        <div class="chat-attach-wrapper">

          <button type="button" class="chat-icon-btn" id="attachBtn" aria-label="Anexar">
            +
          </button>

          <div class="attach-menu" id="attachMenu" hidden>
            <button type="button" id="attachImageBtn">Imagem</button>
            <button type="button" id="attachMusicBtn">Música</button>
            <button type="button" id="attachSpotifyBtn">Link do Spotify</button>
          </div>

        </div>

        <input
          type="text"
          id="messageInput"
          placeholder="Digite uma mensagem..."
          autocomplete="off"
        />

        <button type="button" class="chat-music-btn" id="musicQuickBtn" aria-label="Enviar música">
          ♪
        </button>

        <button type="submit" id="sendMessageBtn">
          Enviar
        </button>

      </form>

    </section>

  </main>

  <div class="confirm-modal" id="confirmModal" hidden>
    <div class="confirm-backdrop"></div>

    <section class="confirm-box">
      <div class="confirm-icon">!</div>

      <h2 id="confirmTitle">Confirmar ação</h2>
      <p id="confirmText">Tem certeza?</p>

      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" id="confirmCancelBtn">
          Cancelar
        </button>

        <button type="button" class="confirm-ok" id="confirmOkBtn">
          Confirmar
        </button>
      </div>
    </section>
  </div>

  <script type="module" src="chat.js"></script>

</body>

</html>
