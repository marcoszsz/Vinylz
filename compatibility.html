<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyl — Compatibilidade</title>
  <link rel="stylesheet" href="compatibility.css">
</head>

<body>

  <header class="navbar">
    <a href="home.html" class="logo">VINYL</a>

    <nav>
      <a href="home.html">Home</a>
      <a href="search.html">Catálogo</a>
      <a href="timeline.html">Timeline</a>
      <a href="profile.html">Perfil</a>
    </nav>
  </header>

  <main class="compatibility-page">

    <section class="compatibility-hero">
      <span class="tag">Match musical</span>
      <h1>Compatibilidade Musical</h1>
      <p id="comparisonText">Comparando gostos musicais...</p>

      <div class="score-circle">
        <span id="compatibilityScore">0%</span>
      </div>

      <p id="scoreLabel" class="score-label">Calculando...</p>
    </section>

    <section class="compatibility-section">
      <h2>Artistas em comum</h2>
      <div id="commonArtists" class="compatibility-grid">
        <p class="message">Carregando...</p>
      </div>
    </section>

    <section class="compatibility-section">
      <h2>Favoritos em comum</h2>
      <div id="commonFavorites" class="compatibility-grid">
        <p class="message">Carregando...</p>
      </div>
    </section>

    <section class="compatibility-section">
      <h2>Gêneros parecidos</h2>
      <div id="commonGenres" class="genre-list">
        <p class="message">Carregando...</p>
      </div>
    </section>

  </main>

  <script type="module" src="compatibility.js"></script>
  <script type="module" src="protect.js"></script>
</body>

</html>
