<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VINYL — Entrar</title>

  <link rel="stylesheet" href="auth.css" />

  <meta name="theme-color" content="#0b0b0d" />
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand-row">
        <a href="home.html" class="logo">VINYL</a>
        <span class="welcome-badge">Bem-vindo de volta</span>
      </div>

      <div class="login-header">
        <h1>Entrar</h1>
        <p class="login-subtitle">
          Entre com seu e-mail, usuário ou Google.
        </p>
      </div>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email" class="sr-only">E-mail ou usuário</label>
          <input
            type="text"
            id="email"
            name="email"
            placeholder="E-mail ou usuário"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group password-wrapper">
          <label for="password" class="sr-only">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Senha"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="Mostrar senha"
          >
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
          </button>
        </div>

        <a href="forgot-password.html" class="forgot-password">
          Esqueci minha senha
        </a>

        <button type="submit" class="login-btn" id="loginBtn">
          Entrar
        </button>

      </form>

      <div class="divider">
        <span>ou</span>
      </div>

      <button type="button" class="google-btn" id="googleLogin">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
          />
          <path
            fill="#FF3D00"
            d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.5 16.2 44 24 44z"
          />
          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.5l6.3 5.3C36.9 39.3 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
          />
        </svg>

        Entrar com Google
      </button>

      <p class="signup-text">
        Não possui conta?
        <a href="register.html">Criar conta</a>
      </p>

      <a href="privacy.html" class="privacy">
        Privacidade e termos
      </a>

    </section>

  </main>

  <script type="module" src="auth.js"></script>

</body>

</html>
